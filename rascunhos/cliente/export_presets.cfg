; Ordem PLANO-2-F2 (JV2.1b): os três exports do cliente — Web, Android e Windows.
; As saídas vão para ../../build/<alvo>/ (fora do projecto; ignorado pelo git). O CI exporta os três a cada commit
; (.github/workflows/f2-aparelhos.yml). As opções que não estão aqui ficam no valor por omissão do Godot 4.7.2.
;
; Web: sem Thread Support (não precisa de COOP/COEP; o servidor de mesa serve-o tal como está, na mesma origem do
;      ws://…/ws). Texturas para desktop e para telemóvel (ETC2/ASTC: project.godot importa-as).
; Android: INTERNET; arm64-v8a (os telemóveis) + x86_64 (o emulador do CI). O tráfego em claro (ws://) só vai para a
;      rede local: o Godot usa sockets nativos, que o NetworkSecurityPolicy do Android não filtra, por isso a guarda é
;      do cliente (rede/rede.gd, `url_permitida_no_android`): fora da rede local, só wss://.
; Windows: x86_64, o .pck embutido no .exe; sem rcedit (modify_resources desligado).

