name: Testes dos rascunhos
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rascunhos/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: o Node 22 rejeita --test-isolation (bad option, run 42290503911);
          # a carta IBX-257 manda trocar para 24 nesse caso. O validador fica no 22.
          node-version: '24'
      - name: Testes do núcleo (só leitura, sem rede, sem escrita)
        run: node --permission --allow-fs-read="$GITHUB_WORKSPACE/rascunhos/servidor/*" --test --test-isolation=none --test-timeout=30000 --test-reporter=spec "testes/*.test.mjs"
  validador-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rascunhos/validador-glb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do validador
        run: node --test --test-reporter=spec "testes/*.test.mjs"

  motor-real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rascunhos/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baixar o motor vivo (público)
        run: curl -fsSL --max-time 30 -o "$RUNNER_TEMP/vlab-completo.js" https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1/vlab-completo.js && sha256sum "$RUNNER_TEMP/vlab-completo.js"
      - name: Prova da porta dos motores (JV1.1-a)
        run: node motores/prova-motor.mjs "$RUNNER_TEMP/vlab-completo.js" "$RUNNER_TEMP/prova"
      - name: Gerar o módulo embrulhado
        run: node motores/embrulhar.mjs "$RUNNER_TEMP/vlab-completo.js" "$RUNNER_TEMP/motores.mjs"
      - name: Integração da sala com o motor real
        if: always()
        env:
          MOTOR_MJS: ${{ runner.temp }}/motores.mjs
        run: node --test --test-reporter=spec "testes-motor-real/*.test.mjs"

  protocolo:
    # Conferência dos schemas do protocolo v2 contra o tráfego real dos testes do servidor (I0004, 08/11/2026).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rascunhos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o validador de JSON Schema
        run: python3 -m pip install "jsonschema>=4.18"
      - name: Recolher o tráfego dos testes do servidor
        run: PROTOCOLO_DUMP="$RUNNER_TEMP/trafego.jsonl" node --test --test-isolation=none --test-timeout=30000 "servidor/testes/*.test.mjs"
      - name: Conferir schemas, exemplos e tráfego
        run: python3 protocolo/ferramentas/conferir-schemas.py "$RUNNER_TEMP/trafego.jsonl"

  cliente:
    # Primeira execução do cliente Godot fora do PC (I0004, 08/11/2026): importar, abrir todos os
    # scripts, correr os testes próprios e arrancar a cena principal sem janela.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rascunhos/cliente
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o Godot 4.7 (linux, sem janela)
        run: |
          for v in 4.7.2-stable 4.7.1-stable 4.7-stable; do
            url="https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_linux.x86_64.zip"
            if curl -fsSL --max-time 180 -o "$RUNNER_TEMP/godot.zip" "$url"; then echo "Godot $v"; break; fi
          done
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$(ls "$RUNNER_TEMP"/godot/Godot_v*)" >> "$GITHUB_ENV"
      - name: Importar o projeto (regista os class_name)
        run: timeout 300 "$GODOT" --headless --path . --import 2>&1 | tail -40 || true
      - name: Abrir todos os scripts
        if: always()
        run: timeout 120 "$GODOT" --headless --path . -s res://testes/abrir_scripts.gd
      - name: Testes do cliente
        if: always()
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . -s res://testes/rodar_testes.gd 2>&1 | tee "$RUNNER_TEMP/rodar_testes.gd.log"
          # Um script que não compila não pode passar calado (o rodar_testes perdeu 27 testes assim no 3b0da14).
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/rodar_testes.gd.log"
      - name: Abrir a Clareira de prova
        if: always()
        run: timeout 180 "$GODOT" --headless --path . -s res://testes/abrir_clareira.gd
      - name: Painel ⚙ em ecrãs baixos (REF_20)
        if: always()
        run: timeout 120 "$GODOT" --headless --path . -s res://testes/medir_painel_config.gd
      - name: Ecrã do Mestre — cena, cartões, recusa noutro papel (JV3.1)
        if: always()
        run: |
          set -o pipefail
          MESTRE_COMANDOS="$RUNNER_TEMP/comandos-mestre.jsonl" timeout 120 "$GODOT" --headless --path . -s res://testes/abrir_mestre.gd 2>&1 | tee "$RUNNER_TEMP/abrir_mestre.gd.log"
          # Um script que não compila não pode passar calado (o rodar_testes perdeu 27 testes assim no 3b0da14).
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/abrir_mestre.gd.log"
      - name: Ecrã do Mestre — arena 3D, Mesa, Agir e «Voltar até aqui» (§12 do desenho)
        if: always()
        run: |
          set -o pipefail
          MESTRE_COMANDOS="$RUNNER_TEMP/comandos-pecas.jsonl" timeout 120 "$GODOT" --headless --path . -s res://testes/pecas_mestre.gd 2>&1 | tee "$RUNNER_TEMP/pecas_mestre.gd.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/pecas_mestre.gd.log"
      - name: Comandos do ecrã do Mestre contra os schemas do protocolo v2
        if: always()
        run: |
          python3 -m pip install --quiet "jsonschema>=4.18"
          python3 ../protocolo/ferramentas/validar-mensagens.py "$RUNNER_TEMP/comandos-mestre.jsonl" --minimo 5
          python3 ../protocolo/ferramentas/validar-mensagens.py "$RUNNER_TEMP/comandos-pecas.jsonl" --minimo 16
      - name: Ecrã do Mestre em ecrãs baixos (F5-MESTRE-01, 844×390 e 780×360)
        if: always()
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . -s res://testes/medir_mestre.gd 2>&1 | tee "$RUNNER_TEMP/medir_mestre.gd.log"
          # Um script que não compila não pode passar calado (o rodar_testes perdeu 27 testes assim no 3b0da14).
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/medir_mestre.gd.log"
      - name: Acções da jogadora onde o site as tem (gavetas do Mover e do Ataque; Defender na ficha)
        if: always()
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . -s res://testes/hud_acoes.gd 2>&1 | tee "$RUNNER_TEMP/hud_acoes.gd.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/hud_acoes.gd.log"
      - name: Canário de privacidade no aparelho da jogadora (JV3.1 §7)
        if: always()
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . -s res://testes/canario_privacidade.gd 2>&1 | tee "$RUNNER_TEMP/canario_privacidade.gd.log"
          # Um script que não compila não pode passar calado (o rodar_testes perdeu 27 testes assim no 3b0da14).
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/canario_privacidade.gd.log"
      - name: Arrancar a cena principal e esperar «pronto»
        if: always()
        run: |
          timeout 60 "$GODOT" --headless --path . --quit-after 600 > "$RUNNER_TEMP/arranque.log" 2>&1 || true
          tail -40 "$RUNNER_TEMP/arranque.log"
          grep -q pronto "$RUNNER_TEMP/arranque.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/arranque.log"

  godot-cliente:
    # Ordem 21 do CM-000009 (proposta (b) da IBX-340): a mesma corrida headless do cliente que o PC faz (ordem 20),
    # com o Godot 4.7.2 fixo (sem cair para outra versão): --import e res://testes/rodar_testes.gd. 5 minutos no total.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rascunhos/cliente
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o Godot 4.7.2 (linux, sem janela)
        run: |
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/godot.zip" "$url"
          sha256sum "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Versão
        run: '"$GODOT" --headless --version'
      - name: Importar o projeto (--headless --import)
        run: |
          set -o pipefail
          timeout 150 "$GODOT" --headless --path . --import 2>&1 | tail -20
      - name: Testes do cliente (--headless --script res://testes/rodar_testes.gd)
        run: |
          set -o pipefail
          timeout 90 "$GODOT" --headless --path . --script res://testes/rodar_testes.gd 2>&1 | tee "$RUNNER_TEMP/rodar_testes.log"
          # Um script que não compila não pode passar calado.
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/rodar_testes.log"
          grep -E "^[0-9]+ de [0-9]+ verificações passaram\.$" "$RUNNER_TEMP/rodar_testes.log"

  ponta-a-ponta:
    # Corrida de ponta a ponta do ecrã do Mestre (I0004, 08/11/2026): o servidor Node de verdade (WebSocket),
    # uma jogadora em Node e o cliente Godot sem janela a fazer de Mestre pela ligação real:
    # lobby → colocar → combate → cartão de desgraça → Confirmar → Voltar até aqui → Terminar → Recomeçar.
    # Duas vezes: com o motor falso e com o VLAB vivo (os dados de crítico da heroína carregados a 1,1,1).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baixar o Godot 4.7 (linux, sem janela)
        run: |
          for v in 4.7.2-stable 4.7.1-stable 4.7-stable; do
            url="https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_linux.x86_64.zip"
            if curl -fsSL --max-time 180 -o "$RUNNER_TEMP/godot.zip" "$url"; then echo "Godot $v"; break; fi
          done
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$(ls "$RUNNER_TEMP"/godot/Godot_v*)" >> "$GITHUB_ENV"
      - name: Importar o projeto do cliente
        working-directory: rascunhos/cliente
        run: timeout 300 "$GODOT" --headless --path . --import 2>&1 | tail -20 || true
      - name: Baixar e embrulhar o VLAB vivo (como o job motor-real)
        working-directory: rascunhos/servidor
        run: |
          curl -fsSL --max-time 30 -o "$RUNNER_TEMP/vlab-completo.js" https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1/vlab-completo.js && sha256sum "$RUNNER_TEMP/vlab-completo.js"
          node motores/embrulhar.mjs "$RUNNER_TEMP/vlab-completo.js" "$RUNNER_TEMP/motores.mjs"
      - name: Servidor + jogadora (Node) + Mestre (Godot), pela ligação de verdade — motor falso e VLAB real
        working-directory: rascunhos
        run: |
          correr() {  # $1 = rótulo, $2 = porta, $3 = MOTOR_MJS (vazio = motor falso)
            L="$RUNNER_TEMP/$1"; mkdir -p "$L"
            MOTOR_MJS="$3" node servidor/e2e/servidor-e2e.mjs "$2" > "$L/servidor.log" 2>&1 &
            SRV=$!
            for i in $(seq 1 50); do grep -q pronto-e2e "$L/servidor.log" && break; sleep 0.2; done
            node servidor/e2e/jogadora-e2e.mjs "$2" > "$L/jogadora.log" 2>&1 &
            JOG=$!
            MESTRE=0
            (cd cliente && timeout 180 "$GODOT" --headless --path . -s res://testes/e2e_mestre.gd -- --servidor=127.0.0.1:$2) > "$L/mestre.log" 2>&1 || MESTRE=$?
            JOGADORA=0
            wait $JOG || JOGADORA=$?
            kill $SRV || true
            echo "######## $1 ########"
            echo "== Mestre (Godot) =="; grep -vE "^\s*$" "$L/mestre.log" | tail -60
            echo "== jogadora (Node) =="; cat "$L/jogadora.log"
            echo "== servidor =="; tail -30 "$L/servidor.log"
            if grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$L/mestre.log"; then return 1; fi
            echo "$1: Mestre=$MESTRE jogadora=$JOGADORA"
            test "$MESTRE" -eq 0 && test "$JOGADORA" -eq 0
          }
          R1=0; correr motor-falso 8765 "" || R1=$?
          R2=0; correr vlab-real 8766 "$RUNNER_TEMP/motores.mjs" || R2=$?
          grep -q "motor REAL" "$RUNNER_TEMP/vlab-real/servidor.log" || { echo "o servidor do VLAB não carregou o motor real"; R2=1; }
          echo "motor falso=$R1 · VLAB real=$R2"
          test "$R1" -eq 0 && test "$R2" -eq 0

  provas-mapa:
    # ORDEM PROVAS-MAPA-CORR9 (correcção 9 da conferência PROVAS-MAPA, C2-2): as provas do mapa a cada push, e não
    # só uma vez no PC. Prova 1: servidor × arena casa a casa nas 18 grelhas, com a ferramenta original do cliente e
    # com a cópia adaptada; prova 2: a batalha de bancada (servidor Node pela WebSocket + jogadora Godot com a arena
    # real + Mestre e espectador Node, grelha-mapa, escala 1,5 → 1 → 2 m). As ferramentas são as da ORDEM-PROVAS-MAPA,
    # tal como estão; o guião só muda a pasta de saída. Depois, os números desta corrida contra os da primeira
    # (os registos de provas/ordem-mapa-jogavel/provas-bancada): têm de se repetir. As impressões bit a bit das
    # alturas são registadas mas não são portão aqui (a primeira corrida foi no Windows; o CI é Linux).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baixar o Godot 4.7.2 (linux, sem janela)
        run: |
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/godot.zip" "$url"
          sha256sum "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      # O import falha o job quando falha: set -o pipefail e sem «|| true», como no passo «Importar o projeto
      # (--headless --import)» do job godot-cliente. O SHA-256 do zip do Godot (passo acima) é impresso no registo,
      # não comparado com um valor esperado, como nos jobs existentes.
      - name: Importar o projeto do cliente
        working-directory: rascunhos/cliente
        run: |
          set -o pipefail
          timeout 300 "$GODOT" --headless --path . --import 2>&1 | tail -20
      - name: As provas do mapa (ferramenta original + cópia adaptada + batalha de bancada)
        run: |
          R=0; bash provas/ordem-provas-mapa-corr9/ferramentas/correr-provas-mapa.sh "$RUNNER_TEMP/provas-mapa" 8794 || R=$?
          for f in provar-terreno-servidor.log provar-terreno-servidor-adaptada.log; do echo "== $f"; grep -vE "^\s*$" "$RUNNER_TEMP/provas-mapa/$f" | tail -8; done
          echo "== bancada-jogadora.log"; grep -vE "^\s*$" "$RUNNER_TEMP/provas-mapa/bancada-jogadora.log" | tail -50
          echo "== bancada-mestre.log"; cat "$RUNNER_TEMP/provas-mapa/bancada-mestre.log"
          exit $R
      - name: Repetição — os números desta corrida contra os da primeira (PROVAS-MAPA)
        if: always()
        run: node provas/ordem-provas-mapa-corr9/ferramentas/comparar-corridas.mjs --md="$RUNNER_TEMP/provas-mapa/repeticao.md" primeira=provas/ordem-mapa-jogavel/provas-bancada ci="$RUNNER_TEMP/provas-mapa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provas-mapa
          path: ${{ runner.temp }}/provas-mapa/
          if-no-files-found: warn

  foto-mestre:
    # Fotos da arena do Mestre para o olho do Mestre (Plano B §B3/§B6; I0004, 08/11/2026): o cliente Godot com
    # render de verdade (Compatibility / OpenGL 3, Mesa llvmpipe, num ecrã virtual xvfb), nunca --headless.
    # As fotos ficam como artefacto do run («fotos-mestre») e no ramo órfão `i0004/fotos-mestre` (só fotos, um
    # commit por run, substituído), para se poderem ler com o git. Um push do GITHUB_TOKEN não dispara outro run.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o ecrã virtual e o Mesa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
      - name: Baixar o Godot 4.7 (linux)
        run: |
          for v in 4.7.2-stable 4.7.1-stable 4.7-stable; do
            url="https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_linux.x86_64.zip"
            if curl -fsSL --max-time 180 -o "$RUNNER_TEMP/godot.zip" "$url"; then echo "Godot $v"; break; fi
          done
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$(ls "$RUNNER_TEMP"/godot/Godot_v*)" >> "$GITHUB_ENV"
      - name: Importar o projeto do cliente
        working-directory: rascunhos/cliente
        run: timeout 300 "$GODOT" --headless --path . --import 2>&1 | tail -20 || true
      - name: Tirar as fotos (render verdadeiro)
        working-directory: rascunhos/cliente
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/fotos"
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 240 "$GODOT" --rendering-driver opengl3 --resolution 1920x1080 \
            --path . -s res://testes/foto_mestre.gd -- --saida="$RUNNER_TEMP/fotos" 2>&1 | tee "$RUNNER_TEMP/foto.log" | grep -vE "^\s*$" | tail -40
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/foto.log"; then exit 1; fi
          grep -q "fotos: 0 falha" "$RUNNER_TEMP/foto.log"
          ls -la "$RUNNER_TEMP/fotos"; sha256sum "$RUNNER_TEMP"/fotos/*.png
      - name: Pôr as fotos no ramo i0004/fotos-mestre (só nos pushes do ramo de trabalho)
        if: github.event_name == 'push' && github.ref == 'refs/heads/i0004/ci4-protocolo'
        run: |
          cd "$RUNNER_TEMP/fotos"
          git init -q -b i0004/fotos-mestre
          git config user.name "foto-mestre (CI)"; git config user.email "ci@users.noreply.github.com"
          printf 'Fotos da arena do Mestre (Plano B). Run %s, commit %s.\nAs fotos 4 e 5 são DEMONSTRAÇÃO dos estados: a marcação é nossa — não é o jogo.\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > LEIA-ME.txt
          sha256sum *.png >> LEIA-ME.txt
          git add -A && git commit -q -m "Fotos da arena do Mestre — run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:i0004/fotos-mestre
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos-mestre
          path: ${{ runner.temp }}/fotos/
          if-no-files-found: warn

  retoma-pc:
    # Ensaio da receita do PC (I0004, 08/11/2026): num Windows, simula o original do PC no 9cbaca8,
    # corre retoma-i0004/aplicar-no-pc.ps1 em ensaio e a sério, e confirma que pára se o PC divergir.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Sem conversão de fins de linha (os SHA são dos bytes do repositório)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simular o original do PC no 9cbaca8
        shell: powershell
        run: |
          $orig = Join-Path $env:RUNNER_TEMP 'jogo-verdadeiro'
          New-Item -ItemType Directory -Force -Path $orig | Out-Null
          git archive --format=tar -o (Join-Path $env:RUNNER_TEMP 'base.tar') 9cbaca88b6e4951d41e518579afd3b32d846fee6 rascunhos
          tar -xf (Join-Path $env:RUNNER_TEMP 'base.tar') -C $orig
      - name: Ensaio, cópia e ensaio outra vez (Windows PowerShell)
        shell: powershell
        run: |
          $orig = Join-Path $env:RUNNER_TEMP 'jogo-verdadeiro'
          powershell -ExecutionPolicy Bypass -File retoma-i0004\aplicar-no-pc.ps1 -Original $orig
          if ($LASTEXITCODE -ne 0) { throw 'o ensaio falhou' }
          powershell -ExecutionPolicy Bypass -File retoma-i0004\aplicar-no-pc.ps1 -Original $orig -Aplicar
          if ($LASTEXITCODE -ne 0) { throw 'a copia falhou' }
          powershell -ExecutionPolicy Bypass -File retoma-i0004\aplicar-no-pc.ps1 -Original $orig
          if ($LASTEXITCODE -ne 0) { throw 'o segundo ensaio falhou' }
      - name: Controlo — com o PC divergente, a receita pára sem copiar
        shell: powershell
        run: |
          $orig2 = Join-Path $env:RUNNER_TEMP 'divergente'
          New-Item -ItemType Directory -Force -Path $orig2 | Out-Null
          tar -xf (Join-Path $env:RUNNER_TEMP 'base.tar') -C $orig2
