name: Aparelhos (F2)
# Ordem PLANO-2-F2 (CM-000009, 2026-11-23): cada um no seu aparelho.
#  - exportar:      os três exports (JV2.1b) a cada commit — Web (sem threads), Windows e Android (arm64-v8a + x86_64) —
#                   e os testes do cliente da F2. Saem como artefactos do CI (sem Pages: a JV0.5 (a) ainda não decidiu o
#                   destino dos builds).
#  - web-chromium:  o export web servido pela mesa de prova (mesma origem do ws), num Chromium sem janela: «pronto» em
#                   ≤ 30 s (JV0.2), a entrada pelo lobby e o ROOM_SNAPSHOT (JV2.1b), e o JSON da V1.0.
#  - windows:       o .exe exportado recebe o ROOM_SNAPSHOT da mesa de prova (JV2.1b).
#  - android:       o APK x86_64 no emulador recebe o ROOM_SNAPSHOT da mesa de prova (JV2.1b).
#  - rede-3-bots:   3 bots e 25 s sem rede: o hash lógico fica igual e o seq contínuo (JV3.4).
#  - qr:            o QR da mesa lido por um decodificador independente (OpenCV) (JV3.4).
# Só fichas fictícias (as de bancada). Nada do Mestre real.
on: [push, workflow_dispatch]
permissions:
  contents: read
env:
  GODOT_VERSAO: 4.7.2-stable

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar o Godot 4.7.2 (linux, sem janela)
        run: |
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/$GODOT_VERSAO/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          sha256sum "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSAO}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Modelos de export em cache (só os 6 que estes exports usam)
        id: modelos
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-modelos-4.7.2-web-windows-android-v1
      - name: Baixar os modelos de export (1,3 GB, só quando a cache falta)
        if: steps.modelos.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --max-time 900 -o "$RUNNER_TEMP/modelos.tpz" "https://github.com/godotengine/godot/releases/download/$GODOT_VERSAO/Godot_v${GODOT_VERSAO}_export_templates.tpz"
          sha256sum "$RUNNER_TEMP/modelos.tpz"
          D=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p "$D"
          unzip -j -o "$RUNNER_TEMP/modelos.tpz" templates/version.txt templates/web_nothreads_release.zip \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/android_debug.apk templates/icudt_godot.dat -d "$D"
          rm "$RUNNER_TEMP/modelos.tpz"
          ls -la "$D"
      - name: Keystore de depuração do Android (gerado aqui; o APK é de depuração)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          # O Godot lê os caminhos do SDK e do Java das definições do editor.
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Importar o projeto
        working-directory: rascunhos/cliente
        run: timeout 600 "$GODOT" --headless --path . --import > "$RUNNER_TEMP/import.log" 2>&1 || true
      - name: Testes dos aparelhos (aparelhos_f2.gd)
        working-directory: rascunhos/cliente
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . -s res://testes/aparelhos_f2.gd 2>&1 | tee "$RUNNER_TEMP/aparelhos_f2.log"
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/aparelhos_f2.log"
      - name: Exportar Web, Windows e Android
        working-directory: rascunhos/cliente
        run: |
          mkdir -p ../../build/web ../../build/windows ../../build/android
          for alvo in "Web:--export-release" "Windows:--export-release" "Android:--export-debug"; do
            p="${alvo%%:*}"; modo="${alvo#*:}"
            echo "== $p ($modo)"
            timeout 900 "$GODOT" --headless --path . "$modo" "$p" > "$RUNNER_TEMP/export-$p.log" 2>&1 || { tail -40 "$RUNNER_TEMP/export-$p.log"; exit 1; }
            ! grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/export-$p.log"
          done
          ls -la ../../build/*
      - name: Conferir os exports (tamanhos, manifesto do APK, ABIs)
        run: |
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
          grep -q 'GODOT_THREADS_ENABLED = false' build/web/index.html  # sem threads: não precisa de COOP/COEP
          test -s build/windows/Assimilacao.exe && test -s build/windows/Assimilacao.console.exe
          test -s build/android/assimilacao.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump xmltree build/android/assimilacao.apk --file AndroidManifest.xml | grep -E "permission|package=|debuggable" | tee "$RUNNER_TEMP/manifesto.txt"
          grep -q "android.permission.INTERNET" "$RUNNER_TEMP/manifesto.txt"
          unzip -l build/android/assimilacao.apk | grep "lib/.*libgodot_android.so" | tee "$RUNNER_TEMP/abis.txt"
          grep -q "lib/arm64-v8a/" "$RUNNER_TEMP/abis.txt" && grep -q "lib/x86_64/" "$RUNNER_TEMP/abis.txt"
          ! grep -qE "lib/(armeabi-v7a|x86)/" "$RUNNER_TEMP/abis.txt"
          du -sh build/web build/windows build/android
      - uses: actions/upload-artifact@v4
        with:
          name: export-web
          path: build/web
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: export-windows
          path: build/windows
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: export-android
          path: build/android/assimilacao.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-registos
          path: ${{ runner.temp }}/*.log
          retention-days: 14

  web-chromium:
    needs: exportar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: export-web
          path: build/web
      - name: O export web no Chromium sem janela — «pronto», lobby, ROOM_SNAPSHOT e a medição V1.0
        working-directory: rascunhos/servidor
        run: |
          google-chrome --version
          node aparelhos/prova-web.mjs --estatica=../../build/web --saida="$RUNNER_TEMP/prova-web" --medir --repetir-medicao 2>&1 \
            | grep -vE "^\[ *[0-9.]+ s\] \[consola\] (WARNING|   at)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-web
          path: ${{ runner.temp }}/prova-web
          retention-days: 14

  windows:
    needs: exportar
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: export-windows
          path: build/windows
      - name: O .exe exportado recebe o ROOM_SNAPSHOT da mesa de prova
        shell: pwsh
        run: |
          $srv = Start-Process node -ArgumentList 'aparelhos/mesa-prova.mjs','--porta=8080','--host=127.0.0.1','--pin=11223344','--mestre-auto' `
            -WorkingDirectory rascunhos/servidor -RedirectStandardOutput "$env:RUNNER_TEMP/mesa.log" -RedirectStandardError "$env:RUNNER_TEMP/mesa.err" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Select-String -Path "$env:RUNNER_TEMP/mesa.log" -Pattern 'combate aberto' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          Get-Content "$env:RUNNER_TEMP/mesa.log"
          $p = Start-Process build/windows/Assimilacao.console.exe -ArgumentList '--headless','--','--servidor=127.0.0.1:8080','"--entrar-nome=Espadachim de Bancada"','--entrar-senha=prova-espadachim' `
            -RedirectStandardOutput "$env:RUNNER_TEMP/windows.log" -RedirectStandardError "$env:RUNNER_TEMP/windows.err" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (Select-String -Path "$env:RUNNER_TEMP/windows.log" -Pattern 'rede: ROOM_SNAPSHOT seq=\d+ fase=combate plataforma=Windows' -Quiet -ErrorAction SilentlyContinue) { $ok = $true; break }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/windows.log" | Select-Object -Last 40
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP/windows.err" -ErrorAction SilentlyContinue; throw 'o Windows não recebeu o ROOM_SNAPSHOT' }
          if (Select-String -Path "$env:RUNNER_TEMP/windows.log" -Pattern 'SCRIPT ERROR|Parse Error' -Quiet) { throw 'erros de script no Windows' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-windows
          path: ${{ runner.temp }}/*.log
          retention-days: 14

  android:
    needs: exportar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: export-android
          path: build/android
      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: A mesa de prova (o emulador chega a ela por 10.0.2.2, a rede local do emulador)
        working-directory: rascunhos/servidor
        run: |
          nohup node aparelhos/mesa-prova.mjs --porta=8080 --host=127.0.0.1 --pin=55667788 --mestre-auto > "$RUNNER_TEMP/mesa.log" 2>&1 &
          for i in $(seq 1 60); do grep -q "combate aberto" "$RUNNER_TEMP/mesa.log" && break; sleep 0.5; done
          cat "$RUNNER_TEMP/mesa.log"
      - name: O APK x86_64 no emulador recebe o ROOM_SNAPSHOT
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash rascunhos/servidor/aparelhos/prova-android.sh build/android/assimilacao.apk "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-android
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.png
          retention-days: 14

  rede-3-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 3 bots e 25 s sem rede — hash lógico igual, seq contínuo
        working-directory: rascunhos/servidor
        run: node aparelhos/prova-3-bots.mjs --saida="$RUNNER_TEMP/relatorio-3-bots.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-3-bots
          path: ${{ runner.temp }}/relatorio-3-bots.json
          retention-days: 14

  qr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: O QR da mesa lido por um decodificador independente (OpenCV)
        working-directory: rascunhos/servidor
        run: |
          python -m pip install --quiet opencv-python-headless==5.1.0.95
          node aparelhos/gerar-qr-prova.mjs "$RUNNER_TEMP/qr"
          python -I aparelhos/conferir-qr.py "$RUNNER_TEMP/qr"
      - name: A página /qr fotografada no Chromium e lida pelo OpenCV (de ponta a ponta)
        working-directory: rascunhos/servidor
        run: |
          node aparelhos/foto-qr.mjs "$RUNNER_TEMP/qr-foto" --links=http://192.168.1.20:8080/
          python -I aparelhos/ler-foto-qr.py "$RUNNER_TEMP/qr-foto"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-qr
          path: ${{ runner.temp }}/qr-foto
          retention-days: 14
