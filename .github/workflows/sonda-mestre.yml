name: Sonda temporária — desgraça pendente no site e no VLAB (I0004; apagar a seguir)
on: [push]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o jogo.js e o vlab-completo.js vivos
        run: |
          set +e
          B=https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1
          curl -s -o jogo.js "$B/jogo.js"; curl -s -o vlab.js "$B/vlab-completo.js"
          sha256sum jogo.js vlab.js | cut -c1-16
          echo "=========== jogo.js: desgracaPendente / acertaSe / acertaAmigo / aliados"
          grep -n -E "desgracaPendente|acertaSe|acertaAmigo|aliadosAoAlcance|aliadoAtingido" jogo.js | cut -c1-220 | head -40
          for r in $(grep -n -E "desgracaPendente" jogo.js | head -4 | cut -d: -f1); do echo "----- jogo.js $r"; sed -n "$((r-6)),$((r+30))p" jogo.js | cut -c1-200; done
          echo "=========== vlab.js linhas 1060-1110"
          sed -n 1060,1110p vlab.js | cut -c1-400
          echo "=========== vlab.js elegiveis"
          for r in $(grep -n -E "elegiveis =|const elegiveis|let elegiveis" vlab.js | head -3 | cut -d: -f1); do echo "----- $r"; sed -n "$((r-4)),$((r+14))p" vlab.js | cut -c1-300; done
          echo "=========== jogo.js 2340-2372"
          sed -n 2340,2372p jogo.js | cut -c1-260
          echo "=========== jogo.js armaQuebrada / armaCaida / conserto"
          grep -n -E "armaQuebrada|armaCaida|consert|armaRecuperada" jogo.js | cut -c1-240 | head -40
