name: Sonda temporária — botões da jogadora no site (I0004; apagar a seguir)
on: [push]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler a página e o jogo.js vivos
        run: |
          set +e
          B=https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1
          curl -s -o index.html "$B/"; curl -s -o jogo.js "$B/jogo.js"
          echo "=========== index.html: botões e barras"
          grep -n -i -E "<button|class=\"barra|id=\"barra|correr|defender|desvincular|transforma|apanhar" index.html | cut -c1-260 | head -60
          echo "=========== jogo.js 1350-1400"
          sed -n 1350,1400p jogo.js | cut -c1-230
          echo "=========== jogo.js 2245-2262"
          sed -n 2245,2262p jogo.js | cut -c1-230
          echo "=========== jogo.js 2385-2400"
          sed -n 2385,2400p jogo.js | cut -c1-230
          echo "=========== ficha: Reacção / declarar-defender"
          grep -n -E "seccaoReacaoDefender\(\)|data-declarar-defender\]|declararDefender\(" jogo.js | cut -c1-200 | head
          echo "=========== FIM"
