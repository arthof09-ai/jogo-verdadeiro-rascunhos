name: Sonda temporária — marcadores 3D do site (I0004; apagar a seguir)
on: [push]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler a página e os scripts vivos
        run: |
          set +e
          B=https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1
          curl -s -o index.html "$B/"; grep -o -E 'src="[^"]+\.js[^"]*"' index.html | head -30
          for f in $(grep -o -E 'src="[^"]+\.js' index.html | sed 's/src="//' | grep -v -E '^https?:' | head -20); do curl -s -o "$(basename $f)" "$B/$f"; done
          ls -la *.js | awk '{print $5, $9}'
          echo "=========== jogo.js alturaMetros / modelo"
          grep -n -E "alturaMetros|modelo:|marcador-lobo|'marcador'" jogo.js | cut -c1-220 | head -30
          echo "=========== cena.js ring/contact posicionamento e selecção"
          grep -n -E "u\.ring|u\.contact|selected|select\(" cena.js | cut -c1-200 | head -40
          sed -n 540,575p cena.js | cut -c1-200
