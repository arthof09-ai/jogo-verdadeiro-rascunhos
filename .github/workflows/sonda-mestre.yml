name: Sonda temporária — terminar, recomeçar e mecânicas do site (I0004; apagar a seguir)
on: [push]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o jogo.js e o vlab-completo.js vivos
        run: |
          set +e
          B=https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1
          curl -s -o jogo.js "$B/jogo.js"; curl -s -o vlab.js "$B/vlab-completo.js"
          sha256sum jogo.js vlab.js | cut -c1-16
          ctx() { f=$1; shift; for pat in "$@"; do echo "=================== $f :: $pat"; grep -n -E "$pat" "$f" | cut -c1-200 | head -30; done; }
          ctx jogo.js "function recomecar|'recomecar'|acao === 'recomecar'|function terminarBatalha|fimDeclarado|function fimDaBatalha|function terminar"
          ctx jogo.js "estabiliz" "requerConfirmacao" "[Rr]ecus" "consert" "levant" "acerta-amigo|acertaAmigo|amigo"
          ctx vlab.js "acerta-amigo|acertaAmigo|amigo|aliado" "consert" "requerConfirmacao|modoDesgraca"
          for r in $(grep -n -E "function recomecar|acao === 'recomecar'|function terminarBatalha" jogo.js | cut -d: -f1); do
            echo "=================== jogo.js linhas $r..+45"; sed -n "${r},$((r+45))p" jogo.js | cut -c1-200
          done
          for r in $(grep -n -E "acerta-amigo" vlab.js | head -3 | cut -d: -f1); do
            echo "=================== vlab.js linhas $((r-12))..+25"; sed -n "$((r-12)),$((r+25))p" vlab.js | cut -c1-200
          done
