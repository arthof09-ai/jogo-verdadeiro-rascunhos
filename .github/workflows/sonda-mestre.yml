name: Sonda temporária — botões da jogadora no site (I0004; apagar a seguir)
on: [push]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler a página e o jogo.js vivos
        run: |
          set +e
          B=https://arthof09-ai.github.io/arena-das-bestas-prototipo-cm9/jogo-t1
          curl -s -o index.html "$B/"; curl -s -o jogo.js "$B/jogo.js"
          echo "=========== index.html: botões e barras"
          grep -n -i -E "<button|class=\"barra|id=\"barra|correr|defender|desvincular|transforma|apanhar" index.html | cut -c1-260 | head -60
          echo "=========== jogo.js 630-700"
          sed -n 630,700p jogo.js | cut -c1-230
          echo "=========== <button em jogo.js"
          grep -n -o -E "<button[^>]*>[^<]{0,60}" jogo.js | cut -c1-200 | head -60
          echo "=========== data-* das acções"
          grep -n -i -E "data-(correr|desvinc|transform|apanhar|acao)|correrUsado = true|desvincular = true|transformada = true" jogo.js | cut -c1-220 | head -30
          echo "=========== index.html 64-120"
          sed -n 64,120p index.html | cut -c1-220
